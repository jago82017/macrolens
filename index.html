<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Macrolens</title>
  <meta name="description" content="Macro & calorie tracker with barcode scanning, Open Food Facts + USDA search, and private on-device AI meal photo estimates.">
  <meta name="theme-color" content="#0c0d12">
  <meta name="color-scheme" content="dark light">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Macrolens">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="css/app.css">
  <script>
    // Apply the saved theme before first paint to avoid a flash.
    try { var t = localStorage.getItem('ml-theme'); if (t && t !== 'system') document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <defs>
      <linearGradient id="grad-kcal" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#7b6cff"/>
        <stop offset="0.55" stop-color="#b56cff"/>
        <stop offset="1" stop-color="#ff7ab8"/>
      </linearGradient>
    </defs>
  </svg>

  <div id="app">
    <main id="view" class="view" aria-live="polite"></main>
    <nav class="tabbar" aria-label="Main"></nav>
  </div>

  <div class="boot-splash" aria-hidden="true">
    <img src="icons/icon-192.png" alt="" width="72" height="72">
  </div>

  <noscript><p style="padding:24px;font-family:sans-serif">Macrolens needs JavaScript enabled.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
